name: Python checks

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The database code (R1-R2) is tested by tests/test_db.py and tests/test_api.py in the job above.
  sql-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SQL practice (Q1-Q15, D1-D3)
        working-directory: practice
        run: |
          pip install pytest
          python make_school_db.py
          python check.py | tee check.txt
          pytest -q test_school_repo.py
          grep -q "Score: 15/15" check.txt

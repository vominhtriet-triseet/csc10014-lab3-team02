[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["practice"]  # warm-up files from public_materials, kept as given

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
